<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>目次</title>

<style>

@font-face{
    font-family:'Panda';
    src:url('pandabakery.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:1280px;
    height:720px;

    overflow:hidden;

    position:relative;

    font-family:'Panda',sans-serif;

    background:#fff3dc;
}

/* 背景 */

.bg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;
}

/* キラキラ */

.sparkle{

    position:absolute;

    opacity:0.7;

    animation:
    sparkle 3s infinite ease-in-out;
}

.star{

    width:20px;
    height:20px;

    background:#fff0a8;

    clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
    );

    box-shadow:
    0 0 14px rgba(255,220,100,0.45);
}

.diamond{

    width:16px;
    height:16px;

    background:#fff0a8;

    transform:rotate(45deg);

    box-shadow:
    0 0 14px rgba(255,220,100,0.45);
}

.s1{
    top:90px;
    left:120px;
}

.s2{
    top:170px;
    right:170px;

    animation-delay:1s;
}

.s3{
    bottom:120px;
    left:180px;

    animation-delay:2s;
}

.s4{
    bottom:150px;
    right:230px;

    animation-delay:1.5s;
}

/* 全体 */

.container{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:18px;
}

/* ロゴ */

.event-logo{

    width:280px;

    margin-bottom:12px;

    filter:
    drop-shadow(0 8px 20px rgba(0,0,0,0.10));
}

/* 白カード */

.card{

    width:900px;

    height:520px;

    background:
    rgba(255,255,255,0.90);

    border:
    6px solid #f6b7c9;

    border-radius:42px;

    box-shadow:
    0 18px 40px rgba(255,190,60,0.08);

    position:relative;

    padding:
    42px
    80px;

    overflow:hidden;
}

/* タイトル */

.title{

    text-align:center;

    font-size:64px;

    color:#ffadc3;

    text-shadow:
    0 4px 0 #fff,
    0 0 8px rgba(255,220,120,0.10);

    margin-bottom:28px;
}

/* 目次 */

.menu{

    display:flex;

    flex-direction:column;

    gap:18px;
}

/* 各行 */

.item{

    display:flex;

    align-items:center;

    gap:18px;

    font-size:42px;

    color:#7b4b35;

    text-shadow:
    0 3px 0 #fff;
}

/* 番号 */

.num{

    min-width:58px;

    color:#ffadc3;

    text-shadow:
    0 3px 0 #fff,
    0 0 8px rgba(255,220,120,0.10);
}

/* わんも〜Cafeロゴ */

.cafe-logo{

    position:absolute;

    right:26px;

    bottom:20px;

    width:130px;

    opacity:0.95;

    filter:
    drop-shadow(0 6px 12px rgba(0,0,0,0.10));
}

/* アニメ */

.fade{

    opacity:0;

    transform:
    translateY(14px);

    animation:
    fadeUp 1s ease forwards;
}

.delay1{
    animation-delay:0.3s;
}

.delay2{
    animation-delay:0.8s;
}

.delay3{
    animation-delay:1.2s;
}

.delay4{
    animation-delay:1.6s;
}

.delay5{
    animation-delay:2s;
}

.delay6{
    animation-delay:2.4s;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:
        translateY(16px);
    }

    to{
        opacity:1;
        transform:
        translateY(0);
    }
}

@keyframes sparkle{

    0%{
        transform:
        scale(0.7);

        opacity:0.35;
    }

    50%{
        transform:
        scale(1.25);

        opacity:1;
    }

    100%{
        transform:
        scale(0.7);

        opacity:0.35;
    }
}

</style>
</head>

<body>

<!-- 背景 -->

<img
src="haikei.png"
class="bg"
>

<!-- キラキラ -->

<div class="sparkle star s1"></div>
<div class="sparkle diamond s2"></div>
<div class="sparkle star s3"></div>
<div class="sparkle diamond s4"></div>

<div class="container">

    <!-- 推し犬ロゴ -->

    <img
    src="wan_logo.png"
    class="event-logo fade delay1"
    >

    <!-- 白カード -->

    <div class="card fade delay2">

        <div class="title">
            目次
        </div>

        <div class="menu">

            <div class="item fade delay2">
                <span class="num">1.</span>
                <span>わんも～推し犬総選挙</span>
            </div>

            <div class="item fade delay3">
                <span class="num">2.</span>
                <span>ランキング発表</span>
            </div>

            <div class="item fade delay4">
                <span class="num">3.</span>
                <span>順位推移</span>
            </div>

            <div class="item fade delay5">
                <span class="num">4.</span>
                <span>クッキー化対象犬</span>
            </div>

            <div class="item fade delay6">
                <span class="num">5.</span>
                <span>推し犬総選挙総投票数</span>
            </div>

        </div>

        <!-- わんも〜Cafeロゴ -->

        <img
        src="wanmow_logo.png"
        class="cafe-logo fade delay6"
        >

    </div>

</div>

</body>
</html>
